[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moult-disk"
version = "1.0.0"
description = "Moult Диск — Защищённая синхронизация файлов для Windows ПК и Android (TLS 1.3 + AES-256-GCM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
    "pystray>=0.19.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
